name: Generar Árbol de Dispositivo TWRP

permissions:
  contents: write

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'  # or any supported version >=3.9,<4.0

      - name: Instalar dependencias
        run: |
          set -euxo pipefail
          python -m pip install --upgrade pip
          # instalar dependencias opcionales sin fallar el paso si no existen
          python -m pip install sebaubuntu_libs || echo "sebaubuntu_libs no disponible, se continúa"
          # instalar twrpdtgen (versión fijada)
          python -m pip install --upgrade twrpdtgen==2.2

      - name: Descargar vendor_boot
        run: |
          set -euxo pipefail
          # usar curl con -f para fallar en 4xx/5xx; -L para seguir redirecciones
          if command -v curl >/dev/null 2>&1; then
            curl -fLo vendor_boot_b.bin "https://files.catbox.moe/ru8mxx.bin"
          else
            # fallback a wget si curl no está disponible
            wget -O vendor_boot_b.bin "https://files.catbox.moe/ru8mxx.bin"
          fi

      - name: Generar Árbol de Dispositivo
        run: |
          set -euxo pipefail
          mkdir -p out
          python -m twrpdtgen -o ./out/ vendor_boot_b.bin

      - name: Comprimir Resultado
        run: |
          set -euxo pipefail
          cd ./out
          zip -r -9 DeviceTree.zip ./*

      - name: Subir Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            ./out/DeviceTree.zip
          name: TWRP_Device_Tree-${{ github.run_id }}
          tag_name: twrp-dt-${{ github.run_id }}
          body: Árbol de dispositivo generado para Infinix X6525.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

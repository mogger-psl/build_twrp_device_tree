name: Generar y publicar Device Tree en Releases

permissions:
  contents: write

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar paquetes del sistema
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y git wget unzip zip file build-essential \
            android-tools-adb android-tools-fastboot lz4 binwalk brotli liblz4-tool \
            python3-venv curl

      - name: Instalar dependencias Python (no interactivas)
        run: |
          set -euxo pipefail
          python -m pip install --upgrade pip setuptools wheel
          # Preferir PyPI (no requiere git). Ajusta versiones si es necesario.
          python -m pip install --upgrade "twrpdtgen==3.0.0" "sebaubuntu_libs==1.6.1" || true
          # Evitar prompts de git en caso de fallback
          export GIT_TERMINAL_PROMPT=0

      - name: Descargar vendor_boot (o boot/recovery)
        run: |
          set -euxo pipefail
          URL="https://files.catbox.moe/ru8mxx.bin"
          OUT="vendor_boot_b.bin"
          if command -v curl >/dev/null 2>&1; then
            curl -fLo "$OUT" "$URL"
          else
            wget -O "$OUT" "$URL"
          fi
          ls -lh "$OUT"

      - name: Generar Device Tree (twrpdtgen)
        run: |
          set -euxo pipefail
          mkdir -p out
          # Preferir el entrypoint instalado
          if command -v twrpdtgen >/dev/null 2>&1; then
            twrpdtgen -o ./out/ vendor_boot_b.bin
          elif python -m twrpdtgen --version >/dev/null 2>&1; then
            python -m twrpdtgen -o ./out/ vendor_boot_b.bin
          else
            echo "twrpdtgen no instalado; intentando instalar forzado desde PyPI"
            python -m pip install --upgrade --force-reinstall "twrpdtgen==3.0.0" || true
            if command -v twrpdtgen >/dev/null 2>&1; then
              twrpdtgen -o ./out/ vendor_boot_b.bin
            else
              echo "ERROR: twrpdtgen no disponible tras reintento" >&2
              exit 1
            fi
          fi

      - name: Verificar salida
        run: |
          set -euxo pipefail
          if [ ! -d out ] || [ "$(ls -A out || true)" = "" ]; then
            echo "No se generaron archivos en out" >&2
            ls -la || true
            exit 1
          fi
          ls -la out
          find out -maxdepth 2 -type f -print

      - name: Empaquetar DeviceTree.zip
        run: |
          set -euxo pipefail
          cd out
          zip -r -9 DeviceTree.zip ./*

      - name: Crear/Actualizar Release y subir DeviceTree.zip
        uses: softprops/action-gh-release@v1
        with:
          files: ./out/DeviceTree.zip
          name: TWRP_Device_Tree-${{ github.run_id }}
          tag_name: twrp-dt-${{ github.run_id }}
          body: |
            Árbol de dispositivo generado automáticamente.
            Run: ${{ github.run_id }} - Commit: ${{ github.sha }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
